name: Set up Python and dependencies
description: >
  Python, uv, the locked dependencies and an editable install of openTEPES.
  Used by every job that does not need a conda package.

inputs:
  python-version:
    description: Python version to install.
    required: true
  extra:
    description: Extra packages to install, space separated. Quoted specifiers are fine.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: requirements.lock

    - name: Install dependencies
      shell: bash
      run: |
        uv pip install --system -r requirements.lock
        uv pip install --system pytest
        pip install -e .
        if [ -n '${{ inputs.extra }}' ]; then
          uv pip install --system ${{ inputs.extra }}
        fi
